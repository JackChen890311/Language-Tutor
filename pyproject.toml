[project]
name = "language-tutor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "mlx-lm>=0.21.0",
    "mlx-vlm>=0.1.9",
    "mlx-audio>=0.2.0",
    "mlx-whisper>=0.0.9",
    "misaki[ja]>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
    "freezegun>=1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
